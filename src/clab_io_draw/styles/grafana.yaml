#General Diagram settings:
background: "none"
shadow: "0"
grid: "0"
pagew: "auto"
pageh: "auto"

# ok for 
#node_width: 200
#node_height: 75

# ok for vertical: upto 8 horiz ports + 4 vert ports
# treated as the "bounding box" for smaller link
#node_width:   300
#node_height:   70
# distance between the node edges
# custom-sized nodes (with "label.graph_height|width") should be "centered" inside the default box
#padding_x:    120
#padding_y:     60

# ok for coxgs horizontal: upto 4 horiz + 8 vert (10 if cramped) ports
node_width:   165
node_height:  130
# better for csr-coxgs-0 monster node with 23 ports on one side
# node_height:  350
padding_x:    200
padding_y:     60

# Base style for nodes; defines the general appearance for all nodes.
#base_style: "shape=image;imageAlign=center;imageVerticalAlign=middle;labelPosition=left;align=right;verticalLabelPosition=top;spacingLeft=0;verticalAlign=bottom;spacingTop=0;spacing=0;"
#base_style: "shape=image;imageAlign=center;imageVerticalAlign=middle;labelPosition=center;align=center;verticalLabelPosition=middle;spacingLeft=0;verticalAlign=middle;spacingTop=0;spacing=0;labelBorderColor=none;fontColor=default;labelBackgroundColor=default;"
base_style: "rounded=1;labelPosition=center;align=center;verticalLabelPosition=middle;spacingLeft=0;verticalAlign=middle;spacingTop=0;spacing=0;labelBorderColor=none;fontColor=default;labelBackgroundColor=default;editableCssRules=\\.st[0-2]$;aspect=fixed;"
            
#Nodes with ports if ports:true (-g option for grafana will set always to true)
ports: true
port_style: "rounded=1;whiteSpace=wrap;html=1;fontColor=#FFFFFF;fontSize=8;strokeColor=#98A2AE;fillColor=#BEC8D2;textShadow=1;connectable=1;resizable=1;"
# style for mid-point; does not matter all that much for now
connector_style: "ellipse;whiteSpace=wrap;html=1;aspect=fixed;fontColor=#FFFFFF;fontSize=8;fillColor=#BEC8D2;strokeColor=none;noLabel=1;"

# just fine for Te2/1/16; way too wide for e7/3 :)
port_width:  32
port_height: 12

# constant spacing between port labels (by default, they are evenly distributed)
port_padding_x: 3
port_padding_y: 3

connector_width:  4
connector_height: 4

# if true, place connector mid-point exactly in the middle of the link
connector_mid: true

# Style for links between nodes
# labels for rates have this style
link_style: "rounded=0;orthogonalLoop=1;html=1;startSize=6;endArrow=openThin;endFill=0;endSize=2;fontSize=8;strokeColor=#98A2AE;fontColor=#FFFFFF;textOpacity=60;labelBackgroundColor=#4D5766;jumpStyle=none;strokeWidth=2;"

# link line width overrides for different bandwidths
link_line_width:
  default: 2
  1G: 1
  10G: 2
  100G: 4

# Styles for labels on the source and target ends of a link
# really does not matter for grafana
src_label_style: "edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontSize=6;fontColor=#FFFFFF;textOpacity=60;labelBackgroundColor=#4D5766;"
trgt_label_style: "edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontSize=6;fontColor=#FFFFFF;textOpacity=60;labelBackgroundColor=#4D5766;"

default_labels: true
label_offset: 20
label_height: 10
label_width: 20
label_alignment: center

# Custom styles for different types of nodes, allowing for unique visual representation based on node role or function
# just an empt box for now
custom_styles:
  default: ""  
  empty: ""  

# icon_to_group_mapping defines the mapping between 'graph-icon' labels specified in the Containerlab file and the custom_styles keys.
# 'graph-icon' is used within the Containerlab YAML configuration under 'labels' to visually differentiate nodes by type in the generated diagram.
# For example, a node with 'graph-icon: switch' in its Containerlab file will use the style defined under 'switch' in custom_styles.
# empty for now
icon_to_group_mapping:
  router: "empty"
  switch: "empty"
  host: "empty"
  empty: "empty"

# To get custom style data from Draw.io:
# 1. Right-click on an element in the Draw.io canvas.
# 2. Select "Edit Style" from the context menu.
# 3. Copy the style string that appears and use it in your custom_styles definition or directly modify it in Draw.io.