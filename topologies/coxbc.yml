name: coxbc
topology:
  kinds:
    arista-core:
      image: some_eos
      type: eos
    arista-leaf:
      image: some_eos
      type: eos      
    cisco4500:
      image: ios_xr_4500
      type: ios
    fortigate:
      image: fortios
      type: fortios
    paloalto:
      image: panos
      type: paloalto
    arista-esr:
      image: old-eos
      type: old-eos
    cisco-nexus:
      image: old-ios
      type: old-nexus
    cisco-nexus-fex:
      image: old-ios
      type: linecard
    cisco-access:
      image: ios-xr
      type: ios

  # current devices list for the queries:
  # instance=~"(spine-coxbc|spine-coxgs|agsr-coxbc-0|leaf-coxbc-|csr-coxbc-|asr-coxbc-|fw-coxbc-0|esr-cslex-2).*"
  nodes:

    vpnr-coxbc-0.console.coxbc.i0:
      kind: fortigate
      labels:
        graph-level: 5
        link-speed: 1G
        graph-height: 40

    fw-coxbc-0.console.coxbc.i0:
      kind: paloalto
      labels:
        graph-level: 1
        link-speed: 1G

    esr-cslex-2.console.cslex.i0:
      kind: arista-esr
      labels:
        graph-level: 1
        graph-height: 40

    agsr-coxbc-0a:
      kind: cisco4500
      labels:
        graph-level: 2
        # to change dataRef for VSS name
        metric-host: agsr-coxbc-0.console.coxbc.i0
        # some of the links (e.g. to fw-coxgs) are slower
        link-speed: 10G
        # 4 ports on the side
        graph-height: 80
    agsr-coxbc-0b:
      kind: cisco4500
      labels:
        graph-level: 2
        metric-host: agsr-coxbc-0.console.coxbc.i0
        link-speed: 10G
        graph-height: 80

    spine-coxgs-1.console.coxgs.i0:
      kind: arista-core
      labels:
        graph-level: 2
        graph-height: 50
    spine-coxgs-2.console.coxgs.i0:
      kind: arista-core
      labels:
        graph-level: 2
        graph-height: 50

    spine-coxbc-1.console.coxbc.i0:
      kind: arista-core
      labels:
        graph-level: 3
        link-speed: 10G
        graph-height: 220
    spine-coxbc-2.console.coxbc.i0:
      kind: arista-core
      labels:
        graph-level: 3
        link-speed: 10G
        graph-height: 220

    csr-coxbc-1a.console.coxbc.i0:
      kind: cisco-nexus
      labels:
        graph-level: 4
        link-speed: 10G
    csr-coxbc-1b.console.coxbc.i0:
      kind: cisco-nexus
      labels:
        graph-level: 4
        link-speed: 10G

    leaf-coxbc-1.console.coxbc.i0:
      kind: arista-leaf
      labels:
        graph-level: 4
        link-speed: 10G
        graph-height: 40
    leaf-coxbc-2.console.coxbc.i0:
      kind: arista-leaf
      labels:
        graph-level: 4
        link-speed: 10G
        graph-height: 40

    csr-coxbc-2a.console.coxbc.i0:
      kind: cisco-nexus
      labels:
        graph-level: 5
        link-speed: 10G
        # 4 ports on the side
        graph-height: 80
    csr-coxbc-2b.console.coxbc.i0:
      kind: cisco-nexus
      labels:
        graph-level: 5
        link-speed: 10G
        graph-height: 80

    asr-coxbc-1.console.coxbc.i0:
      kind: cisco-access
      labels:
        graph-level: 4
        link-speed: 10G
        graph-height: 70

  # python ./netbox2clab.py --devices fw-coxbc-0,esr-cslex-2,agsr-coxbc-0a,agsr-coxbc-0b,spine-coxgs-1,spine-coxgs-2,spine-coxbc-1,spine-coxbc-2,csr-coxbc-1a,csr-coxbc-1b,leaf-coxbc-1,leaf-coxbc-2,csr-coxbc-2a,csr-coxbc-2b,asr-coxbc-1-1,asr-coxbc-1-2
